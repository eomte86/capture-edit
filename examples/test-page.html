<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>capture-edit 테스트 페이지</title>
<style>
  body { margin: 0; background: #f5f5f5; font-family: sans-serif; }
  .card {
    width: 800px; margin: 40px; padding: 24px;
    background: #fff; border: 1px solid #ddd; border-radius: 12px;
  }
  .bars { display: flex; align-items: flex-end; gap: 48px; height: 220px; }
  .bar { width: 90px; text-align: center; font-size: 18px; }
  .bar i { display: block; margin: 0 auto 8px; width: 90px; }
  .up { background: #e53935; height: 120px; }
  .down { background: #1e88e5; height: 180px; }
</style>
</head>
<body>
<div class="card">
  <h2>테스트 차트 카드</h2>
  <div class="bars">
    <div class="bar"><i class="up"></i>개인 +422억</div>
    <div class="bar"><i class="down"></i>외국인 -9,811억</div>
    <div class="bar"><i class="up"></i>기관계 +8,682억</div>
  </div>
</div>
</body>
</html>
